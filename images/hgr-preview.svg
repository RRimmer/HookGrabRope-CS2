<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Hook Grab Rope for CS2</title>
<desc id="desc">Dark banner with a curved cyan beam that ends in a hook, and the three ability names.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2=".4"><stop stop-color="#0d1315"/><stop offset="1" stop-color="#16313a"/></linearGradient>
  <linearGradient id="beam" x2="1"><stop stop-color="#3fb6c9"/><stop offset=".6" stop-color="#7ff0ff"/><stop offset="1" stop-color="#ff5d5d"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="250" rx="12" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
  <text x="50" y="72" fill="#7fd4e3" font-size="19" letter-spacing="3">COUNTER-STRIKE 2  /  COUNTERSTRIKEShARP</text>
  <text x="48" y="140" fill="#f2fbfd" font-weight="bold" font-size="57">Hook Grab Rope</text>
  <text x="51" y="184" fill="#a9c6cd" font-size="19">Rimmer   ·   v0.1.0</text>
  <path d="M330 238 C 470 232, 520 158, 650 158 S 820 196, 905 122" fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="905" cy="122" r="5" fill="#ff5d5d" filter="url(#glow)"/>
  <g font-size="16" letter-spacing="4" font-weight="bold">
    <rect x="600" y="196" width="86" height="30" rx="6" fill="#12262c" stroke="#2f7a88"/>
    <text x="643" y="217" fill="#8fe6f4" text-anchor="middle">GRAB</text>
    <rect x="700" y="196" width="86" height="30" rx="6" fill="#12262c" stroke="#2f7a88"/>
    <text x="743" y="217" fill="#8fe6f4" text-anchor="middle">HOOK</text>
    <rect x="800" y="196" width="86" height="30" rx="6" fill="#12262c" stroke="#2f7a88"/>
    <text x="843" y="217" fill="#8fe6f4" text-anchor="middle">ROPE</text>
  </g>
</g>
</svg>
